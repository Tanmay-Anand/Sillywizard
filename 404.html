<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SIGNAL LOST — SILLYWIZARD</title>
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#070707" />
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png" />
<!-- SELF-CONTAINED ON PURPOSE. No stylesheet, no script, no font request.
     A 404 is the one page that has to render when something about the deploy
     is wrong, and every external file it depends on is one more thing that
     can be the reason you are seeing it. -->
<style>
  html,body{ margin:0; height:100%; background:#070707; color:#e9e9e9;
             font-family:'Space Mono',ui-monospace,'SF Mono','Roboto Mono',monospace; }
  main{ min-height:100%; display:flex; flex-direction:column;
        align-items:flex-start; justify-content:center; padding:0 22px; gap:22px; }
  p{ margin:0; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
     color:#636363; }
  h1{ margin:0; font-size:clamp(2.4rem,9vw,5rem); font-weight:700;
      letter-spacing:-0.045em; line-height:.94; color:#e9e9e9;
      font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif; }
  b{ color:#e8271c; font-weight:400; }
  a{ color:#e9e9e9; text-decoration:none; border-bottom:1px solid #e8271c;
     padding-bottom:2px; font-size:10px; letter-spacing:.08em;
     text-transform:uppercase; }
  a:hover{ color:#e8271c; }
</style>
</head>
<body>
<main>
  <p>SUBSTRATE <span style="color:#636363">//</span> <b>404</b></p>
  <h1>Nothing is<br />observed here.</h1>
  <p>The address resolved. The page did not.</p>
  <a href="/">RETURN TO THE SUBSTRATE +</a>
</main>
</body>
</html>
